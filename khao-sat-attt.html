<style>
:root{--ink:#17252a;--mut:#64757c;--bg:#f1f5f8;--card:#fff;--fld:#f1f5f8;--line:#d9e2e7;--teal:#0b5f66;--g1:#8e44ad;--g2:#0b7a75;--g3:#2563eb;--g4:#d97706;--g5:#c0392b}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "Be Vietnam Pro","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,#0b5f66,#0f4c5c);color:#fff;padding:28px 0 90px}
.w{max-width:1000px;margin:0 auto;padding:0 16px}
h1{margin:0 0 6px;font-size:26px;line-height:1.25}
header p{margin:0;font-size:12px;opacity:.85}
.top{margin-top:-70px;background:var(--card);border-radius:14px;box-shadow:0 4px 18px #0002;padding:18px;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.ring{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--teal) 0%,#dde5ea 0);flex:none}
.ring div{width:92px;height:92px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;font-size:10px;color:var(--mut)}
.ring b{display:block;font-size:24px;color:var(--ink)}
.tiles{display:flex;gap:10px;flex-wrap:wrap;flex:1}
.tile{border:1px solid var(--line);border-top:3px solid var(--c);border-radius:8px;padding:8px 12px;min-width:140px;background:var(--fld);cursor:pointer;font-size:12px;flex:1}
.tile b{display:block;font-size:20px;color:var(--c)}
.tile .bar{height:4px;background:#dde5ea;border-radius:3px;margin-top:4px}.tile .bar i{display:block;height:100%;background:var(--c);border-radius:3px}
.tile.on{outline:2px solid var(--ink)}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:14px 0;font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);border-radius:14px;padding:2px 10px;font-size:11.5px;background:var(--fld);cursor:pointer;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.miss{color:var(--g5);font-weight:600}
section.s{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:16px;margin:14px 0}
section.s h2{margin:0;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h2 small{color:var(--mut);font-weight:400;font-size:12px}
.tag{margin-left:auto;border:1px solid var(--c);color:var(--c);border-radius:12px;padding:1px 10px;font-size:11px;font-weight:500}
.hint{background:var(--fld);color:var(--mut);border-radius:6px;padding:7px 10px;margin:10px 0;font-size:12px}
.f{margin:14px 0}.f>label{display:block;font-weight:600;font-size:12.5px;margin-bottom:5px}
.req{color:var(--g5)}
input[type=text],input[type=date],textarea,select{width:100%;background:var(--fld);border:1px solid var(--line);border-radius:7px;padding:9px 11px;font:inherit;color:inherit}
input:focus,textarea:focus,select:focus{outline:2px solid var(--teal);outline-offset:1px;background:#fff}
textarea{min-height:64px;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opts label{border:1px solid var(--line);background:var(--fld);border-radius:16px;padding:5px 12px;cursor:pointer;font-size:12.5px;display:flex;gap:6px;align-items:center}
.opts label:has(input:checked){border-color:var(--teal);background:#e0f1f1;color:var(--teal);font-weight:600}
.det{margin-top:8px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:max-content}
th{background:var(--fld);font-size:11.5px;text-align:left;padding:8px;white-space:nowrap}
td{padding:3px 4px;border-top:1px solid var(--line)}
td input,td select{min-width:110px;padding:6px 8px}
td.n,th.n{width:34px;text-align:center;color:var(--mut)}td.st{padding:6px 8px;min-width:200px;font-weight:500}
.add{margin-top:8px;border:1px dashed var(--teal);color:var(--teal);background:#fff;border-radius:6px;padding:4px 12px;cursor:pointer;font:inherit;font-size:12px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 60px}
.acts button{border:1px solid var(--teal);background:#fff;color:var(--teal);border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.acts .p{background:var(--teal);color:#fff}
.sec-hide{display:none}
@media print{header,.top,.box,.acts,.add{display:none}body{background:#fff}section.s{break-inside:avoid}.sec-hide{display:block!important}}
</style>

var KEY='khaosat_attt_v1',D={};
/* ===== Dựng giao diện ===== */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function row(f,i,v){var h='<tr><td class="n">'+(i+1)+'</td>';
 f.cols.forEach(function(c,j){var p=c.split('|'),nm=p[0].replace('*',''),val=v?v[j]:'';
  if(j==0&&f.fx){h+='<td class="st">'+esc(f.fx[i]||'')+'</td>';return}
  if(p[1]){h+='<td><select><option value=""></option>'+p[1].split(',').map(function(o){return'<option'+(o==val?' selected':'')+'>'+o+'</option>'}).join('')+'</select></td>'}
  else h+='<td><input type="text" value="'+esc(val||'')+'" aria-label="'+esc(nm)+'"></td>'});
 return h+'</tr>'}
function field(f){var h='<div class="f" id="f_'+f.id+'"><label>'+esc(f.l)+(f.q?' <span class="req">*</span>':'')+'</label>';
 if(f.t=='t')h+='<input type="text" data-k="'+f.id+'" placeholder="'+esc(f.p)+'">';
 else if(f.t=='d')h+='<input type="text" data-k="'+f.id+'" placeholder="dd/mm/yyyy">';
 else if(f.t=='a')h+='<textarea data-k="'+f.id+'"></textarea>';
 else if(f.t=='r'||f.t=='c'){var ty=f.t=='r'?'radio':'checkbox';h+='<div class="opts">'+f.o.map(function(o){return'<label><input type="'+ty+'" name="'+f.id+'" value="'+esc(o)+'">'+esc(o)+'</label>'}).join('')+'</div>';
  if(f.d)h+='<input type="text" class="det" data-k="'+f.id+'_d" placeholder="Chi tiết (nếu có)">'}
 else{h+='<div class="tw"><table data-tb="'+f.id+'"><thead><tr><th class="n">#</th>'+f.cols.map(function(c){var p=c.split('|')[0];return'<th>'+esc(p.replace('*',''))+(p.indexOf('*')>-1?' <span class="req">*</span>':'')+'</th>'}).join('')+'</tr></thead><tbody>';
  for(var i=0;i<f.n;i++)h+=row(f,i);h+='</tbody></table></div>'+(f.fx?'':'<button type="button" class="add" data-add="'+f.id+'">+ Thêm hàng</button>')}
 return h+'</div>'}
var F={};
S.forEach(function(s){s[4].forEach(function(f){F[f.id]=f;f.g=s[2]})});
$('#app').html(S.map(function(s){return'<section class="s" id="s_'+s[0]+'" style="--c:var('+G[s[2]][1]+')"><h2>'+esc(s[0])+'. '+esc(s[1])+' <small data-sp="'+s[0]+'"></small><span class="tag">'+G[s[2]][0]+'</span></h2><div class="hint">'+esc(s[3])+'</div>'+s[4].map(field).join('')+'</section>'}).join(''));
$('#tiles').html('<div class="tile on" data-g="all" style="--c:var(--ink)"></div>'+Object.keys(G).map(function(k){return'<div class="tile" data-g="'+k+'" style="--c:var('+G[k][1]+')"></div>'}).join(''));
/* ===== Thu thập / khôi phục dữ liệu ===== */
function collect(){var d={};
 $('[data-k]').each(function(){d[$(this).data('k')]=$(this).val()});
 $('#app .opts').each(function(){var $i=$(this).find('input'),n=$i.attr('name');
  d[n]=$i.attr('type')=='radio'?($i.filter(':checked').val()||''):$i.filter(':checked').map(function(){return this.value}).get()});
 $('[data-tb]').each(function(){d[$(this).data('tb')]=$(this).find('tbody tr').map(function(){return[$(this).find('input,select').map(function(){return $(this).val()}).get()]}).get()});
 return d}
function restore(d){
 Object.keys(d).forEach(function(k){var v=d[k],f=F[k];
  if(f&&f.t=='tb'&&Array.isArray(v)){if(f.fx){}else{var $b=$('[data-tb='+k+'] tbody').empty();v.forEach(function(r,i){$b.append(row(f,i,r))})}
   if(f.fx)$('[data-tb='+k+'] tbody tr').each(function(i){$(this).find('input,select').each(function(j){$(this).val((v[i]||[])[j])})})}
  else if(f&&(f.t=='r'||f.t=='c')){$('[name='+k+']').each(function(){this.checked=[].concat(v).indexOf(this.value)>-1})}
  else $('[data-k='+k+']').val(v)})}
/* ===== Tiến độ ===== */
function done(f,d){var v=d[f.id];if(f.t=='tb')return(v||[]).some(function(r){return r.some(function(c,j){return(f.fx&&j==0?false:String(c||'').trim())})});
 if(f.t=='c')return(v||[]).length>0;return String(v||'').trim()!==''}
function update(){var d=collect(),tot={all:[0,0]},miss=[];
 Object.keys(G).forEach(function(k){tot[k]=[0,0]});
 S.forEach(function(s){var a=0,b=0;s[4].forEach(function(f){if(!f.q)return;b++;var ok=done(f,d);if(ok)a++;else miss.push(f);tot[f.g][1]++;tot.all[1]++;if(ok){tot[f.g][0]++;tot.all[0]++}});
  $('[data-sp="'+s[0]+'"]').text(a+'/'+b)});
 function pc(t){return t[1]?Math.round(t[0]/t[1]*100):0}
 $('#pct').text(pc(tot.all)+'%');$('#cnt').text(tot.all[0]+'/'+tot.all[1]+' mục bắt buộc');
 $('#ring').css('background','conic-gradient(var(--teal) '+pc(tot.all)*3.6+'deg,#dde5ea 0)');
 $('.tile').each(function(){var k=$(this).data('g'),t=tot[k];$(this).html((k=='all'?'Toàn xã':G[k][0])+'<b>'+pc(t)+'%</b>'+t[0]+'/'+t[1]+' mục · còn '+(t[1]-t[0])+'<div class="bar"><i style="width:'+pc(t)+'%"></i></div>')});
 var gf=$('.tile.on').data('g'),list=miss.filter(function(f){return gf=='all'||f.g==gf});
 $('#missBox').html(list.length?'<span class="miss">Còn '+list.length+' mục bắt buộc chưa điền:</span><div class="chips">'+list.map(function(f){return'<span class="chip" data-go="'+f.id+'" title="'+esc(f.l)+'">'+esc(f.l.replace(/^[^.]*\.\s*/,function(m){return m}))+'</span>'}).join('')+'</div>':'<b style="color:var(--g2)">Đã điền đủ các mục bắt buộc.</b>');
 $('#orgName').text(d.A1&&d.A1.trim()?d.A1:'Chưa nhập tên đơn vị');
 return d}
function save(){var d=update();try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
/* ===== Sự kiện ===== */
$('#app').on('input change','input,select,textarea',save);
$('#app').on('click','.add',function(){var f=F[$(this).data('add')],$b=$('[data-tb='+f.id+'] tbody');$b.append(row(f,$b.children().length));save()});
$('#tiles').on('click','.tile',function(){$('.tile').removeClass('on');$(this).addClass('on');update()});
$('#missBox').on('click','.chip',function(){var $t=$('#f_'+$(this).data('go'));$('html,body').animate({scrollTop:$t.offset().top-20},300);$t.find('input,select,textarea').first().focus()});
$('#bSave').on('click',function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(collect(),null,1)],{type:'application/json'}));a.download='khao-sat-attt-'+new Date().toISOString().slice(0,10)+'.json';a.click()});
$('#bOpen').on('click',function(){$('#fOpen').click()});
$('#fOpen').on('change',function(){var r=new FileReader();r.onload=function(){try{restore(JSON.parse(r.result));save()}catch(e){alert('File dữ liệu không hợp lệ.')}};if(this.files[0])r.readAsText(this.files[0]);this.value=''});
$('#bCopy').on('click',function(){var t=JSON.stringify(collect(),null,1);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){alert('Đã sao chép dữ liệu.')},function(){prompt('Sao chép (Ctrl+C):',t)})});
$('#bPrint').on('click',function(){window.print()});
$('#bClear').on('click',function(){if(confirm('Xóa toàn bộ dữ liệu đã nhập?')){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}});
try{var s=localStorage.getItem(KEY);if(s)restore(JSON.parse(s))}catch(e){}
update();
});
</script>
